  <meta name="theme-color" content="#0A0A0A">
  <title>Offline · EVENT APP</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0A0A0A; color: #fff;

    a { display: inline-block; margin-top: 8px; padding: 10px 20px; border-radius: 8px; background: #B6F23A; color: #0A0A0A; font-weight: 600; text-decoration: none; }
  </style>

  <main>
    <div class="logo">EVENT <span>APP</span></div>
