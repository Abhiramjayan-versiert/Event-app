<!doctype html>
<html lang="en">
  <body style="margin:0;padding:0;background:#f4f4f4;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;color:#0a0a0a">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="padding:32px 16px">
      <tr><td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#ffffff;border:1px solid #e5e5e5;border-radius:10px;overflow:hidden">
          <tr><td style="background:#0a0a0a;padding:20px 28px;font-weight:900;font-size:20px;letter-spacing:-0.5px;color:#ffffff">EVENT <span style="color:#b6f23a">APP</span></td></tr>
          <tr><td style="padding:28px">
            <h1 style="margin:0 0 12px;font-size:20px">Confirm your email</h1>
            <p style="margin:0 0 24px;font-size:14px;line-height:1.6;color:#444">Please confirm your email address to activate your EVENT APP account.</p>
            <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=signup" style="display:inline-block;background:#b6f23a;color:#0a0a0a;font-weight:600;font-size:14px;text-decoration:none;padding:12px 20px;border-radius:6px">Confirm email</a>
            <p style="margin:24px 0 0;font-size:12px;line-height:1.6;color:#777">This link expires soon and can be used once. If you did not expect this email, you can ignore it.</p>
          </td></tr>
        </table>
        <p style="font-size:11px;color:#999;margin-top:16px">EVENT APP · College event management</p>
      </td></tr>
    </table>
  </body>
</html>
